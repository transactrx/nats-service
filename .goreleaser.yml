version: 2

project_name: nats-discover

builds:
  - main: ./cmd/nats-discover
    binary: nats-discover
    goos:
      - darwin
      - linux
      - windows
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w -X main.version={{.Version}}
    env:
      - CGO_ENABLED=0
    mod_timestamp: "{{ .CommitTimestamp }}"

archives:
  - formats:
      - tar.gz
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        formats:
          - zip

homebrew:
  - repository:
      owner: transactrx
      name: homebrew-tap
      token: "{{ .Env.HOMEBREW_TAP_TOKEN }}"
    directory: Formula
    homepage: https://github.com/transactrx/nats-service
    description: CLI tool to discover NATS services using the nats-service framework
    license: MIT
    install: |
      bin.install "nats-discover"
    test: |
      system "#{bin}/nats-discover", "--version"

scoops:
  - repository:
      owner: transactrx
      name: scoop-bucket
      token: "{{ .Env.HOMEBREW_TAP_TOKEN }}"
    homepage: https://github.com/transactrx/nats-service
    description: CLI tool to discover NATS services using the nats-service framework
    license: MIT

checksum:
  name_template: checksums.txt

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
