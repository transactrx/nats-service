version: '3.8'

services:
  nats:
    image: nats:alpine
    ports:
      - "4222:4222" # Default NATS port
      - "8222:8222" # NATS monitoring port (optional)
    # Example of starting NATS with jetstream enabled, if needed for tests
    # command: "-js"

  app:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      - nats
    environment:
      # Example environment variable, if your app needs to know NATS address
      NATS_URL: nats://nats:4222
      NATS_QUEUE_NAME: testing
    # The command to run tests will be specified in the run_tests.sh script
    # For local development, you might want to override the command to run the service:
    # command: ["./nats-service-example"]
    volumes:
      - .:/app # Mount the current directory to /app in the container for local development
    # Add any necessary ports for the app service if it exposes any
    # ports:
    #   - "8080:8080"

  # You can add more services here if your tests require them
  # For example, a requester service:
  # requester:
  #   build:
  #     context: .
  #     dockerfile: Dockerfile
  #   depends_on:
  #     - nats
  #   environment:
  #     NATS_URL: nats://nats:4222
  #   # Command to run the requester example, if needed for testing scenarios
  #   # command: ["./requester-example"]
  #   volumes:
  #     - .:/app
