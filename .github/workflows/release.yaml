on:
  push:
    branches:
      - Production

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Go
        uses: actions/setup-go@v3
        with:
          go-version: 1.25.1

      - name: Install Docker Compose
        run: |
          sudo apt-get update
          sudo apt-get install -y docker-compose

      - name: Run tests with docker-compose
        run: |
          chmod +x ./run_tests.sh
          ./run_tests.sh

  release-on-push:
    runs-on: ubuntu-latest
    needs: test
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    outputs:
      version: ${{ steps.release.outputs.version }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - id: release
        uses: rymndhng/release-on-push-action@master
        with:
          bump_version_scheme: patch
          tag_prefix: "v"
          use_github_release_notes: true

  build-cli:
    name: Build CLI Binaries
    runs-on: ubuntu-latest
    needs: release-on-push
    if: needs.release-on-push.outputs.version != ''
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Go
        uses: actions/setup-go@v3
        with:
          go-version: 1.25.1

      - name: Build Windows AMD64
        run: |
          GOOS=windows GOARCH=amd64 go build -o nats-discover-windows-amd64.exe ./cmd/nats-discover

      - name: Build macOS ARM64
        run: |
          GOOS=darwin GOARCH=arm64 go build -o nats-discover-darwin-arm64 ./cmd/nats-discover

      - name: Upload binaries to release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ needs.release-on-push.outputs.tag_name }}
          files: |
            nats-discover-windows-amd64.exe
            nats-discover-darwin-arm64